<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>魔法攻击效果方案预览</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px;
      background: radial-gradient(circle at 50% 0, #20275f, #090b22 58%, #050612);
      color: #fff;
    }
    header { max-width: 1320px; margin: 0 auto 22px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    header p { margin: 0; color: #bdc7f4; line-height: 1.6; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(340px, 1fr));
      gap: 22px;
      max-width: 1320px;
      margin: auto;
    }
    .card {
      overflow: hidden;
      border: 1px solid rgba(176, 190, 255, 0.24);
      border-radius: 22px;
      background: rgba(17, 20, 55, 0.86);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }
    .card.recommended { border-color: rgba(255, 210, 105, 0.72); }
    .scene { display: block; width: 100%; aspect-ratio: 16/9; background: #171a48; }
    .copy { padding: 16px 18px 18px; }
    .title-row { display: flex; align-items: center; gap: 10px; }
    h2 { margin: 0; font-size: 20px; }
    .badge {
      padding: 4px 9px;
      border-radius: 999px;
      background: #ffd66e;
      color: #4e2b00;
      font-size: 12px;
      font-weight: 800;
    }
    .copy p { margin: 8px 0 0; color: #c8cff2; font-size: 14px; line-height: 1.55; }
    .scene-shade { fill: rgba(12, 13, 48, 0.16); }
    .fx-path { fill: none; stroke-linecap: round; stroke-linejoin: round; path-length: 1; }
    .fx-ribbon {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: reveal 2.35s cubic-bezier(.18,.68,.28,1) infinite;
      mix-blend-mode: screen;
    }
    .fx-wave {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: reveal 2.35s cubic-bezier(.16,.7,.25,1) infinite;
      mix-blend-mode: screen;
    }
    .pulse-ring { mix-blend-mode: screen; }
    .spark { mix-blend-mode: screen; }
    @keyframes reveal {
      0%, 8% { opacity: 0; stroke-dashoffset: 1; }
      18% { opacity: .9; }
      58% { opacity: .82; stroke-dashoffset: 0; }
      74%, 100% { opacity: 0; stroke-dashoffset: 0; }
    }
    @media (max-width: 850px) { .grid { grid-template-columns: 1fr; } body { padding: 16px; } }
  </style>
</head>
<body>
  <header>
    <h1>从吉他发射到判定点：4种魔法光波方案</h1>
    <p>这里是独立视觉样片，不会修改当前游戏。每个方案都会自动循环；重点看“主体是线、波前、粒子云，还是混合魔法光波”。</p>
  </header>
  <main class="grid">
    <article class="card">
      <svg class="scene" data-effect="ribbon" viewBox="0 0 2048 1152" aria-label="A 极光丝带"></svg>
      <div class="copy"><div class="title-row"><h2>A · 极光丝带波</h2></div><p>数条透明彩色光带从吉他铺向判定点。方向最明确，但仍然保留“线”的感觉。</p></div>
    </article>
    <article class="card">
      <svg class="scene" data-effect="pulse" viewBox="0 0 2048 1152" aria-label="B 魔法脉冲波"></svg>
      <div class="copy"><div class="title-row"><h2>B · 魔法脉冲波</h2></div><p>一组彩色弧形波前依次飞出，没有持续连接线。像连续释放的魔法冲击波。</p></div>
    </article>
    <article class="card">
      <svg class="scene" data-effect="nebula" viewBox="0 0 2048 1152" aria-label="C 星云粒子流"></svg>
      <div class="copy"><div class="title-row"><h2>C · 星云粒子流</h2></div><p>完全由彩色光点和星芒组成，没有明确波形。魔法感最强，但“光波”轮廓较弱。</p></div>
    </article>
    <article class="card recommended">
      <svg class="scene" data-effect="hybrid" viewBox="0 0 2048 1152" aria-label="D 闪粉魔法光波"></svg>
      <div class="copy"><div class="title-row"><h2>D · 闪粉魔法光波</h2><span class="badge">推荐</span></div><p>细薄的彩色波形负责表现“光波”，大量星芒和闪粉负责魔法质感；没有实心核心或粗光束。</p></div>
    </article>
  </main>
  <script>
    const NS = 'http://www.w3.org/2000/svg';
    const PATH = 'M 340 850 Q 650 660 1035 545';
    const colors = ['#8cf4ff', '#f58cff', '#a887ff', '#ffe58d', '#ffffff'];
    const el = (name, attrs = {}) => {
      const node = document.createElementNS(NS, name);
      Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
      return node;
    };

    function baseScene(svg, index) {
      const defs = el('defs');
      const glow = el('filter', { id: `glow-${index}`, x: '-80%', y: '-80%', width: '260%', height: '260%' });
      glow.append(el('feGaussianBlur', { stdDeviation: '12', result: 'blur' }));
      const merge = el('feMerge');
      merge.append(el('feMergeNode', { in: 'blur' }), el('feMergeNode', { in: 'SourceGraphic' }));
      glow.append(merge);
      defs.append(glow);
      svg.append(defs);
      svg.append(el('image', { href: 'assets/backgrounds/game-background.png', width: '2048', height: '1152', preserveAspectRatio: 'xMidYMid slice' }));
      svg.append(el('rect', { class: 'scene-shade', width: '2048', height: '1152' }));
      svg.append(el('image', {
        href: 'assets/characters/penguin-idle.png',
        x: '0', y: '468', width: '660', height: '660', preserveAspectRatio: 'xMidYMid meet'
      }));
      svg.append(el('image', { href: 'assets/ui/judge-point.png', x: '845', y: '355', width: '380', height: '380' }));
    }

    function wavePath(amplitude, cycles, phase = 0) {
      const pts = [];
      for (let i = 0; i <= 72; i++) {
        const t = i / 72;
        const u = 1 - t;
        const x = u*u*340 + 2*u*t*650 + t*t*1035;
        const y = u*u*850 + 2*u*t*660 + t*t*545;
        const tx = 2*u*(650-340) + 2*t*(1035-650);
        const ty = 2*u*(660-850) + 2*t*(545-660);
        const len = Math.hypot(tx, ty) || 1;
        const envelope = Math.pow(Math.sin(Math.PI*t), .72) * (.28 + .72*t);
        const offset = Math.sin(t*Math.PI*2*cycles + phase) * amplitude * envelope;
        pts.push([x - ty/len*offset, y + tx/len*offset]);
      }
      return pts.map((p, i) => `${i ? 'L' : 'M'} ${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');
    }

    function motionParticle(svg, options, index) {
      const group = el('g', { class: 'spark', filter: `url(#glow-${options.sceneIndex})` });
      const shape = index % 4 === 0
        ? el('path', { d: 'M 0 -10 L 3 -3 L 10 0 L 3 3 L 0 10 L -3 3 L -10 0 L -3 -3 Z', fill: options.color })
        : el('circle', { cx: options.ox, cy: options.oy, r: options.r, fill: options.color });
      if (index % 4 === 0) shape.setAttribute('transform', `translate(${options.ox} ${options.oy})`);
      const move = el('animateMotion', { path: PATH, dur: `${options.duration}s`, begin: `${options.delay}s`, repeatCount: 'indefinite' });
      const fade = el('animate', { attributeName: 'opacity', values: '0;1;.9;0', keyTimes: '0;.18;.72;1', dur: `${options.duration}s`, begin: `${options.delay}s`, repeatCount: 'indefinite' });
      group.append(shape, move, fade);
      svg.append(group);
    }

    function effectRibbon(svg, idx) {
      [[0, '#8ff6ff', 13], [30, '#f6a1ff', 9], [-28, '#ffe68d', 7]].forEach(([phase, color, width], i) => {
        svg.append(el('path', { class: 'fx-path fx-ribbon', d: wavePath(74-i*12, 2.2+i*.35, phase), stroke: color, 'stroke-width': width, opacity: '.58', pathLength: '1', filter: `url(#glow-${idx})`, style: `animation-delay:${i*.08}s` }));
      });
    }

    function effectPulse(svg, idx) {
      for (let i = 0; i < 7; i++) {
        const g = el('g', { class: 'pulse-ring', filter: `url(#glow-${idx})` });
        const arc = el('path', { d: 'M -28 -70 Q 42 0 -28 70', fill: 'none', stroke: colors[i%colors.length], 'stroke-width': 9-i*.45, 'stroke-linecap': 'round' });
        const move = el('animateMotion', { path: PATH, dur: '1.25s', begin: `${i*.11}s`, repeatCount: 'indefinite' });
        const fade = el('animate', { attributeName: 'opacity', values: '0;1;.8;0', dur: '1.25s', begin: `${i*.11}s`, repeatCount: 'indefinite' });
        g.append(arc, move, fade); svg.append(g);
      }
    }

    function effectNebula(svg, idx, count = 64) {
      for (let i = 0; i < count; i++) {
        motionParticle(svg, {
          sceneIndex: idx,
          color: colors[i%colors.length],
          ox: (Math.random()-.5)*110,
          oy: (Math.random()-.5)*110,
          r: 3+Math.random()*8,
          duration: 1.05+Math.random()*.35,
          delay: Math.random()*1.7,
        }, i);
      }
    }

    function effectHybrid(svg, idx) {
      [[96, 3.1, 0, '#82f1ff'], [72, 3.8, 1.8, '#f28dff'], [48, 2.65, 3.6, '#ffe789']].forEach(([amp, cycles, phase, color], i) => {
        svg.append(el('path', { class: 'fx-path fx-wave', d: wavePath(amp, cycles, phase), stroke: color, 'stroke-width': i ? 4 : 5, opacity: '.72', pathLength: '1', filter: `url(#glow-${idx})`, style: `animation-delay:${i*.06}s` }));
      });
      effectNebula(svg, idx, 34);
    }

    document.querySelectorAll('.scene').forEach((svg, index) => {
      baseScene(svg, index);
      const effect = svg.dataset.effect;
      if (effect === 'ribbon') effectRibbon(svg, index);
      if (effect === 'pulse') effectPulse(svg, index);
      if (effect === 'nebula') effectNebula(svg, index);
      if (effect === 'hybrid') effectHybrid(svg, index);
    });
  </script>
</body>
</html>
